name: Build README

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install requests

    - name: Generate top languages card
      uses: stats-organization/github-readme-stats-action@v2
      with:
        card: top-langs
        options: username=Ex-iT&layout=compact&theme=algolia
        path: images/top-langs.svg
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update README
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python build_readme.py
        cat README.md

    - name: Commit and push if anything changed
      run: |
        git config --global user.email "readme-bot@ex-it.nl"
        git config --global user.name "README-bot"
        git diff --quiet || (git add README.md images/top-langs.svg && git commit -m "Updated README")
        git push
